<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पूरी प्रोफाइल - Sambandh360</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff5f8,#f8e8f0);
  margin:0;
  padding:15px;
  color:#333;
}

.container{
  max-width:650px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:25px;
  box-shadow:0 5px 20px rgba(146,37,111,0.15);
}

h1{
  color:#92256f;
  text-align:center;
  font-size:28px;
  margin:10px 0 20px;
}

.profile{
  background:#fff;
  padding:20px;
  margin:18px 0;
  border-radius:22px;
  box-shadow:0 4px 15px rgba(0,0,0,0.10);
  border:1px solid #f0d8e5;
}

.profile h2{
  color:#c2187a;
  margin-top:0;
  font-size:32px;
  font-weight:700;
  text-align:left;
  border-bottom:2px solid #f3c5e3;
  padding-bottom:10px;
}

.profile img{
  width:200px;
  height:200px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:15px auto;
  border:5px solid #f3d3e3;
}

.profile p{
  font-size:17px;
  margin:10px 0;
  line-height:1.6;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#92256f;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .container{
    padding:15px;
    margin:10px auto;
  }

  h1{
    font-size:25px;
  }

  .profile{
    padding:16px;
  }

  .profile img{
    width:160px;
    height:160px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div style="text-align:center;margin-bottom:20px;">
  <img src="logo.png" style="width:220px;max-width:100%;height:auto;">
</div>

<h2 style="text-align:center;">पूरी प्रोफाइल</h2>

  <div id="profile" class="profile">
    प्रोफाइल लोड हो रही है...
  </div>

  <button onclick="history.back()">⬅️ वापस जाएँ</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadProfile(){

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if(!id){
    document.getElementById("profile").innerHTML =
      "❌ प्रोफाइल ID नहीं मिली।";
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", id)
    .maybeSingle();

  if(error || !data){
    document.getElementById("profile").innerHTML =
      "❌ प्रोफाइल लोड नहीं हो सकी।";
    console.log(error);
    return;
  }

document.getElementById("profile").innerHTML = `
  <h2 style="color:#ff8ee8">${data.name || "नाम उपलब्ध नहीं"}</h2>

  ${data.photo_url ? `<img src="${data.photo_url}" style="width:180px;height:180px;object-fit:cover;border-radius:50%;display:block;margin:15px auto;">` : ""}

  <p>🎂 उम्र: ${data.age || "-"}</p>
  <p>👤 लिंग: ${data.gender || "-"}</p>
  <p>📍 शहर: ${data.city || "-"}</p>
  <p>🏠 राज्य: ${data.state || "-"}</p>
  <p>💼 व्यवसाय: ${data.occupation || "-"}</p>
  <p>📄 परिचय: ${data.bio || "-"}</p>

  <button id="interestBtn" onclick="sendInterest('${data.id}')"
  style="margin-top:20px;padding:15px;width:100%;background:#a00068;color:white;border:none;border-radius:10px;font-size:18px;">
  ❤️ Interest भेजें
  </button>
  <button onclick="toggleShortlist('${data.id}')"
style="margin-top:10px;padding:15px;width:100%;">
❤️ Shortlist
</button>
`;
}

async function sendInterest(receiverId) {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("पहले Login करें");
    return;
  }

  if (user.id === receiverId) {
    alert("आप खुद को Interest नहीं भेज सकते");
    return;
  }

  const { error } = await supabaseClient
    .from("interests")
    .insert({
      sender_id: user.id,
      receiver_id: receiverId
    });
    await supabaseClient
      .from("notifications")
      .insert({
        user_id: receiverId,
        type: "interest",
        message: "💗 आपको नया Interest मिला है!"
      });
  if (error) {
    alert("Interest नहीं भेजा गया: " + error.message);
    return;
  }

  alert("❤️ Interest सफलतापूर्वक भेज दिया गया!");
}
  async function toggleShortlist(profileId) {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("पहले Login करें");
    return;
  }

  if (user.id === profileId) {
    alert("आप खुद को Shortlist नहीं कर सकते");
    return;
  }

  const { data: existing } = await supabaseClient
    .from("shortlists")
    .select("id")
    .eq("user_id", user.id)
    .eq("profile_id", profileId)
    .maybeSingle();

  if (existing) {

    const { error } = await supabaseClient
      .from("shortlists")
      .delete()
      .eq("id", existing.id);

    if (error) {
      alert("❌ Shortlist हट नहीं सकी");
      return;
    }

    alert("💔 Shortlist से हटा दिया गया");

  } else {

    const { error } = await supabaseClient
      .from("shortlists")
      .insert({
        user_id: user.id,
        profile_id: profileId
      });

    if (error) {
      alert("❌ Shortlist नहीं हुआ: " + error.message);
      return;
    }

    alert("❤️ Profile Shortlist हो गई!");
  }
  }
loadProfile();
</script>

</body>
</html>
