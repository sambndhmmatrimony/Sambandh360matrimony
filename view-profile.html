<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पूरी प्रोफाइल - Sambandh360</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff5f8,#f8e8f0);
  margin:0;
  padding:15px;
  color:#333;
}

.container{
  max-width:650px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:25px;
  box-shadow:0 5px 20px rgba(146,37,111,0.15);
}

h1{
  color:#92256f;
  text-align:center;
  font-size:28px;
  margin:10px 0 20px;
}

.profile{
  background:#fff;
  padding:20px;
  margin:18px 0;
  border-radius:22px;
  box-shadow:0 4px 15px rgba(0,0,0,0.10);
  border:1px solid #f0d8e5;
}

.profile h2{
  color:#c2187a;
  margin-top:0;
  font-size:32px;
  font-weight:700;
  text-align:left;
  border-bottom:2px solid #f3c5e3;
  padding-bottom:10px;
}

.profile img{
  width:200px;
  height:200px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:15px auto;
  border:5px solid #f3d3e3;
}

.profile p{
  font-size:17px;
  margin:10px 0;
  line-height:1.6;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#92256f;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .container{
    padding:15px;
    margin:10px auto;
  }

  h1{
    font-size:25px;
  }

  .profile{
    padding:16px;
  }

  .profile img{
    width:160px;
    height:160px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div style="text-align:center;margin-bottom:20px;">
  <img src="logo.png" style="width:220px;max-width:100%;height:auto;">
</div>

<h2 style="text-align:center;">पूरी प्रोफाइल</h2>

  <div id="profile" class="profile">
    प्रोफाइल लोड हो रही है...
  </div>

  <button onclick="history.back()">⬅️ वापस जाएँ</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storageKey: "sambandh360-auth"
    }
  }
);

async function loadProfile(){

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if(!id){
    document.getElementById("profile").innerHTML =
      "❌ प्रोफाइल ID नहीं मिली।";
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", id)
    .maybeSingle();

  if(error || !data){
    document.getElementById("profile").innerHTML =
      "❌ प्रोफाइल लोड नहीं हो सकी।";
    console.log(error);
    return;
  }

document.getElementById("profile").innerHTML = `
  <h2 style="color:#ff8ee8">${data.name || "नाम उपलब्ध नहीं"}</h2>

  ${data.photo_url ? `
    <img src="${data.photo_url}"
      style="width:200px;height:200px;object-fit:cover;border-radius:50%;display:block;margin:15px auto;">
  ` : ""}

  <h3>👤 व्यक्तिगत जानकारी</h3>
  <p>🎂 उम्र: ${data.age || "-"}</p>
  <p>👤 लिंग: ${data.gender || "-"}</p>
 <p>🔒 मोबाइल और ईमेल: Privacy के लिए छिपाया गया है</p>
  <p>💍 वैवाहिक स्थिति: ${data.marital_status || "-"}</p>
  <p>📏 कद: ${data.height || "-"}</p>
  <p>⚖️ वजन: ${data.weight || "-"}</p>
  <p>🎨 रंग: ${data.complexion || "-"}</p>

  <h3>🛕 धार्मिक जानकारी</h3>
  <p>🛕 धर्म: ${data.religion || "-"}</p>
  <p>जाति: ${data.caste || "-"}</p>
  <p>🗣️ मातृभाषा: ${data.mother_tongue || "-"}</p>

  <h3>📍 स्थान</h3>
  <p>📍 शहर: ${data.city || "-"}</p>
  <p>🏠 राज्य: ${data.state || "-"}</p>

  <h3>🎓 शिक्षा और नौकरी</h3>
  <p>🎓 शिक्षा: ${data.education || "-"}</p>
  <p>📚 शिक्षा विवरण: ${data.education_details || "-"}</p>
  <p>🏫 कॉलेज: ${data.college || "-"}</p>
  <p>💼 व्यवसाय: ${data.occupation || "-"}</p>
  <p>🏢 कंपनी: ${data.company || "-"}</p>
  <p>💰 आय: ${data.income || "-"}</p>

  <h3>👨‍👩‍👧‍👦 परिवार की जानकारी</h3>
  <p>👨 पिता का नाम: ${data.father_name || "-"}</p>
  <p>👩 माता का नाम: ${data.mother_name || "-"}</p>
  <p>👫 भाई-बहन: ${data.siblings || "-"}</p>
  <p>🏡 परिवार का प्रकार: ${data.family_type || "-"}</p>
  <p>💼 परिवार की स्थिति: ${data.family_status || "-"}</p>

  <h3>🍽️ जीवनशैली</h3>
  <p>🍽️ भोजन: ${data.food_habit || "-"}</p>
  <p>🚭 धूम्रपान: ${data.smoking || "-"}</p>
  <p>🍷 शराब: ${data.drinking || "-"}</p>

  <h3>📝 परिचय</h3>
  <p>${data.about || "-"}</p>
  <p>${data.bio || "-"}</p>

  <h3>❤️ जीवनसाथी की पसंद</h3>
  <p>🎂 उम्र: ${data.partner_age_min || "-"} से ${data.partner_age_max || "-"}</p>
  <p>📏 कद: ${data.partner_height || "-"}</p>
  <p>🎓 शिक्षा: ${data.partner_education || "-"}</p>
  <p>💼 व्यवसाय: ${data.partner_occupation || "-"}</p>
  <p>📍 शहर: ${data.partner_city || "-"}</p>
  <p>🛕 धर्म: ${data.partner_religion || "-"}</p>
  <p>जाति: ${data.partner_caste || "-"}</p>

  <button id="interestBtn"
    onclick="sendInterest('${data.id}')"
    style="margin-top:20px;padding:15px;width:100%;background:#a00068;color:white;border:none;border-radius:10px;">
  ❤️ Interest भेजें
</button>
`;
async function sendInterest(receiverId) {

  try {
    const { data: userData, error: userError } =
      await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
      alert("पहले Login करें");
      return;
    }

    const user = userData.user;

    if (user.id === receiverId) {
      alert("आप खुद को Interest नहीं भेज सकते");
      return;
    }

    const { error: interestError } =
      await supabaseClient
        .from("interests")
        .insert({
          sender_id: user.id,
          receiver_id: receiverId
        });

    if (interestError) {
      alert("Interest नहीं भेजा गया: " + interestError.message);
      return;
    }

    alert("❤️ Interest सफलतापूर्वक भेज दिया गया! ✅");

    await supabaseClient
      .from("notifications")
      .insert({
        user_id: receiverId,
        type: "interest",
        message: "💗 आपको नया Interest मिला है!"
      });

  } catch (error) {
    alert("Interest में समस्या: " + error.message);
  }
}

window.sendInterest = sendInterest;
  async function toggleShortlist(profileId) {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("पहले Login करें");
    return;
  }

  if (user.id === profileId) {
    alert("आप खुद को Shortlist नहीं कर सकते");
    return;
  }

  const { data: existing } = await supabaseClient
    .from("shortlists")
    .select("id")
    .eq("user_id", user.id)
    .eq("profile_id", profileId)
    .maybeSingle();

  if (existing) {

    const { error } = await supabaseClient
      .from("shortlists")
      .delete()
      .eq("id", existing.id);

    if (error) {
      alert("❌ Shortlist हट नहीं सकी");
      return;
    }
    alert("💔 Shortlist से हटा दिया गया");

  } else {

    const { error } = await supabaseClient
      .from("shortlists")
      .insert({
        user_id: user.id,
        profile_id: profileId
      });

    if (error) {
      alert("❌ Shortlist नहीं हुआ: " + error.message);
      return;
    }

    alert("❤️ Profile Shortlist हो गई!");
  }
  }
  }   // toggleShortlist का आखिरी हिस्सा

async function sendContactRequest(profileId) {

  const { data: userData, error: userError } =
    await supabaseClient.auth.getUser();

  if (userError || !userData.user) {
    alert("कृपया पहले Login करें।");
    return;
  }

  const requesterId = userData.user.id;

  if (requesterId === profileId) {
    alert("आप अपनी ही Profile को Contact Request नहीं भेज सकते।");
    return;
  }

  const { data: existingRequest, error: checkError } =
    await supabaseClient
      .from("contact_requests")
      .select("id")
      .eq("requester_id", requesterId)
      .eq("profile_id", profileId)
      .maybeSingle();

  if (checkError) {
    alert("Request check नहीं हो सकी: " + checkError.message);
    return;
  }

  if (existingRequest) {
    alert("Contact Request पहले ही भेजी जा चुकी है।");
    return;
  }

  const { error } =
    await supabaseClient
      .from("contact_requests")
      .insert({
        requester_id: requesterId,
        profile_id: profileId,
        status: "pending"
      });

  if (error) {
    alert("Contact Request नहीं भेजी गई: " + error.message);
    return;
  }
await supabaseClient
  .from("notifications")
  .insert({
    user_id: profileId,
    type: "contact_request",
    message: "📞 आपको नया Contact Request मिला है!"
  });
  
  alert("📞 Contact Request सफलतापूर्वक भेज दी गई! ✅");
}
loadProfile();
</script>

</body>
</html>
