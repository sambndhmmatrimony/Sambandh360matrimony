<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat - Sambandh360</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  padding:0;
  background:#160d14;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:#ff69c8;
}

#messages{
  min-height:400px;
  padding:10px;
}

.message{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  background:#211a1f;
}

.inputBox{
  display:flex;
  gap:8px;
  position:sticky;
  bottom:0;
  background:#160d14;
  padding:10px 0;
}

input{
  flex:1;
  padding:14px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#c00078;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<div class="container">

<h1>💬 Chat</h1>

<div id="messages">
  Loading...
</div>

<div class="inputBox">
  <input id="messageInput" type="text" placeholder="Message लिखें...">
  <button onclick="sendMessage()">📤 Send</button>
</div>

</div>

<script>

const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params = new URLSearchParams(window.location.search);
const receiverId = params.get("user");

let currentUser = null;

async function loadChat(){

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if(!user){
    document.getElementById("messages").innerHTML =
      "❌ पहले Login करें";
    return;
  }

  currentUser = user;

  if(!receiverId){
    document.getElementById("messages").innerHTML =
      "❌ User नहीं मिला";
    return;
  }

  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${user.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${user.id})`
    )
    .order("created_at", {
      ascending:true
    });

  if(error){
    document.getElementById("messages").innerHTML =
      "❌ Chat लोड नहीं हुई: " + error.message;
    return;
  }

  const box = document.getElementById("messages");

  if(!data || data.length === 0){
    box.innerHTML = "💬 अभी कोई message नहीं है।";
    return;
  }

  box.innerHTML = "";

  data.forEach(msg => {

    const div = document.createElement("div");

    div.className = "message";

    div.innerHTML =
      (msg.sender_id === user.id ? "🟢 आप: " : "🔵 सामने वाला: ")
      + msg.message;

    box.appendChild(div);

  });

}

async function sendMessage(){

  if(!currentUser){
    alert("पहले Login करें");
    return;
  }

  const input = document.getElementById("messageInput");

  const message = input.value.trim();

  if(!message){
    return;
  }

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      sender_id: currentUser.id,
      receiver_id: receiverId,
      message: message
    });

  if(error){

    alert("❌ Message नहीं भेजा गया: " + error.message);

    return;
  }

  input.value = "";

  loadChat();
}

loadChat();

</script>

</body>
</html>
