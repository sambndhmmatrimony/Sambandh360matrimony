<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles - Sambandh360</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f1f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #92256f;
    }

    .profile {
  background: #fff;
  padding: 22px;
  margin: 18px 0;
  border-radius: 24px;
  box-shadow: 0 6px 20px rgba(146,37,111,0.15);
  border: 1px solid #f0d5e8;
}

    .profile h2 {
      color: #92256f;
      margin-top: 0;
    }

    .profile p {
      font-size: 17px;
      margin: 8px 0;
    }

    .loading {
      text-align: center;
      font-size: 18px;
    }
    @media (max-width:600px) {
  body {
    padding: 10px;
  }

  .container {
    width: 100%;
    box-sizing: border-box;
  }

  .profile {
    padding: 16px;
    border-radius: 18px;
  }

  input,
select,
button {
  width: 100%;
  box-sizing: border-box;
  margin-top: 12px;
  padding: 15px;
  font-size: 17px;
  border-radius: 14px;
  border: 1px solid #ddd;
}

button {
  background: linear-gradient(135deg, #92256f, #c2187a);
  color: white;
  border: none;
  font-weight: bold;
  box-shadow: 0 4px 12px rgba(146,37,111,0.25);
}

button:active {
  transform: scale(0.98);
}

  h1 {
    font-size: 25px;
  }
    
    .profile img {
  display: block;
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 50%;
  margin: 15px auto 25px;
  border: 6px solid #f3c5e3;
  box-shadow: 0 5px 18px rgba(146,37,111,0.20);
    }
  </style>
</head>

<body>

<div class="container">

  <div style="text-align:center;margin-bottom:20px;">
  <img src="logo.png" style="width:220px;max-width:100%;height:auto;">
</div>
  <button id="logoutBtn">
🚪 Logout
</button>

<button onclick="location.href='my-interests.html'">
💌 My Interests
</button>
  <button onclick="location.href='shortlist.html'">
❤️ My Shortlist
</button>

<button onclick="location.href='notifications.html'">
🔔 Notifications <span id="unreadCount"></span>
  </button>
<input id="search" type="text" placeholder="🔎 नाम या शहर खोजें">

<select id="genderFilter">
  <option value="">सभी Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

<input id="cityFilter" type="text" placeholder="📍 शहर से खोजें">
  <div id="profiles">
    <p class="loading">Profiles लोड हो रही हैं...</p>
  </div>

</div>

<script type="module">

  import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  document.getElementById("logoutBtn").onclick = async function () {
  const { error } = await supabase.auth.signOut();

  if (error) {
    alert("Logout नहीं हुआ: " + error.message);
    return;
  }

  window.location.href = "index.html";
};
async function loadProfiles() {
    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .order("created_at", { ascending: false });
    const { data: { user } } = await supabase.auth.getUser();
  if (user) {
  await supabase
    .from("profiles")
    .update({
      last_seen: new Date().toISOString()
    })
    .eq("user_id", user.id);
  }
    const box = document.getElementById("profiles");

    if (error) {
      box.innerHTML =
        "<p>❌ Profiles लोड नहीं हुईं: " +
        error.message +
        "</p>";
      return;
    }

function showProfiles(list) {
  box.innerHTML = "";

  if (!list || list.length === 0) {
    box.innerHTML = "<p class='loading'>अभी कोई Profile नहीं मिली।</p>";
    return;
  }

  list.forEach(profile => {
    box.innerHTML += `
      <div class="profile">
        <h2>${profile.name || "नाम उपलब्ध नहीं"}</h2>
${profile.photo_url ? `<img src="${profile.photo_url}" style="width:150px;height:150px;object-fit:cover;border-radius:50%;">` : ""}
        <p>🎂 उम्र: ${profile.age || "-"}</p>

        <p>👤 लिंग: ${profile.gender || "-"}</p>

        <p>📍 शहर: ${profile.city || "-"}</p>

        <p>🏠 राज्य: ${profile.state || "-"}</p>

        <p>💼 व्यवसाय: ${profile.occupation || "-"}</p>

        <p>📄 परिचय: ${profile.bio || "-"}</p>
      <button onclick="location.href='view-profile.html?id=${profile.id}'">
💖 पूरी प्रोफाइल देखें
</button>
${user && profile.id === user.id ? `
<button onclick="location.href='edit-profile.html'">
✏️ Edit Profile
</button>
` : ""}
</div>
    `;
  });
}

function filterProfiles() {
  const search = document.getElementById("search").value.toLowerCase();
  const gender = document.getElementById("genderFilter").value.toLowerCase();
  const city = document.getElementById("cityFilter").value.toLowerCase();

  const filtered = data.filter(profile => {
    const name = (profile.name || "").toLowerCase();
    const profileCity = (profile.city || "").toLowerCase();
    const profileGender = (profile.gender || "").toLowerCase();

    return (
      (name.includes(search) || profileCity.includes(search)) &&
      profileCity.includes(city) &&
      (gender === "" || profileGender === gender)
    );
  });

  showProfiles(filtered);
}

showProfiles(data);

document.getElementById("search").addEventListener("input", filterProfiles);
document.getElementById("genderFilter").addEventListener("change", filterProfiles);
document.getElementById("cityFilter").addEventListener("input", filterProfiles);
    
  }

  loadProfiles();
async function loadUnreadCount() {

  const { data: { user } } =
    await supabase.auth.getUser();

  if (!user) return;

  const { count, error } =
    await supabase
      .from("notifications")
      .select("*", { count: "exact", head: true })
      .eq("user_id", user.id)
      .eq("is_read", false);

  if (error) return;

  const badge = document.getElementById("unreadCount");

  if (count > 0) {
    badge.innerText = " (" + count + ")";
  } else {
    badge.innerText = "";
  }
}

loadUnreadCount();
</script>

</body>
</html>
