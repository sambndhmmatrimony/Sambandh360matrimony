<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles - Sambandh360</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f1f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #92256f;
    }

    .profile {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 3px 10px #ddd;
    }

    .profile h2 {
      color: #92256f;
      margin-top: 0;
    }

    .profile p {
      font-size: 17px;
      margin: 8px 0;
    }

    .loading {
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💍 Sambandh360 Profiles</h1>
<input id="search" type="text" placeholder="🔎 नाम या शहर खोजें">

<select id="genderFilter">
  <option value="">सभी Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

<input id="cityFilter" type="text" placeholder="📍 शहर से खोजें">
  <div id="profiles">
    <p class="loading">Profiles लोड हो रही हैं...</p>
  </div>

</div>

<script type="module">

  import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadProfiles() {

    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .order("created_at", { ascending: false });

    const box = document.getElementById("profiles");

    if (error) {
      box.innerHTML =
        "<p>❌ Profiles लोड नहीं हुईं: " +
        error.message +
        "</p>";
      return;
    }

    if (!data || data.length === 0) {
      box.innerHTML =
        "<p class='loading'>अभी कोई Profile नहीं है।</p>";
      return;
    }

    box.innerHTML = "";

    data.forEach(profile => {

      box.innerHTML += `
        <div class="profile">

          <h2>${profile.name || "नाम उपलब्ध नहीं"}</h2>

          <p>🎂 उम्र: ${profile.age || "-"}</p>

          <p>👤 लिंग: ${profile.gender || "-"}</p>

          <p>📍 शहर: ${profile.city || "-"}</p>

          <p>🏠 राज्य: ${profile.state || "-"}</p>

          <p>💼 व्यवसाय: ${profile.occupation || "-"}</p>

          <p>📝 परिचय: ${profile.bio || "-"}</p>

        </div>
      `;

    });
  }

  loadProfiles();

</script>

</body>
</html>
