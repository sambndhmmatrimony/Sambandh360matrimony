<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Interests - Sambandh360</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #160d14;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ff8bd8;
    }

    .card {
      background: #211d1f;
      margin: 15px 0;
      padding: 20px;
      border-radius: 15px;
    }

    .card h2 {
      color: #ff8bd8;
    }

    .status {
      color: #ffd166;
      font-weight: bold;
    }

    .back {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #a00068;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>❤️ My Interests</h1>

  <div id="interests">
    Loading...
  </div>

  <button class="back" onclick="location.href='profile.html'">
    ⬅️ वापस Profile पर जाएँ
  </button>

</div>

<script>

const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadInterests() {
  const box = document.getElementById("interests");

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    box.innerHTML = "❌ पहले Login करें";
    return;
  }

  const { data, error } = await supabaseClient
    .from("interests")
    .select("*")
    .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`)
    .order("created_at", { ascending: false });

  if (error) {
    box.innerHTML = "❌ Interests लोड नहीं हुए: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "💌 अभी कोई Interest नहीं मिला।";
    return;
  }

  box.innerHTML = "";

  data.forEach(item => {
    const type =
      item.sender_id === user.id
        ? "📤 आपने Interest भेजा"
        : "📥 आपको Interest मिला";

    box.innerHTML += `
  <div class="card">
    <h2>💖 Interest</h2>
    <p class="status">${type}</p>
    <p>📌 Status: ${item.status}</p>
    <p>📅 ${new Date(item.created_at).toLocaleString()}</p>
  ${
  item.status === "accepted"
    ? `
      <button onclick="location.href='view-profile.html?id=${
        item.sender_id === user.id
          ? item.receiver_id
          : item.sender_id
      }'">
        👤 Profile देखें
      </button>
    `
    : ""
}
    ${
      item.receiver_id === user.id && item.status === "pending"
        ? `
          <button onclick="updateInterest('${item.id}', 'accepted')">
            ✅ Accept
          </button>

          <button onclick="updateInterest('${item.id}', 'rejected')">
            ❌ Reject
          </button>
        `
        : ""
    }
  </div>
`;
  });
}
async function updateInterest(id, status) {
  const { error } = await supabaseClient
    .from("interests")
    .update({ status: status })
    .eq("id", id);

  if (error) {
    alert("❌ Update नहीं हुआ: " + error.message);
    return;
  }

  alert(
    status === "accepted"
      ? "✅ Interest Accept हो गया!"
      : "❌ Interest Reject हो गया!"
  );
  }

 async function openChat(userId) {
  window.location.href = "chat.html?user=" + userId;
}
  
loadInterests();
</script>

</body>
</html>
