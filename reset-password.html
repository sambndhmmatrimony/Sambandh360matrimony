<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - Sambandh360 Matrimony</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #120b10;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: #202020;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: #ff8bd8;
      font-size: 36px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #aaa;
      background: #444;
      color: white;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 18px;
      background: #a00068;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔑 नया Password सेट करें</h1>

    <input
      type="password"
      id="newPassword"
      placeholder="नया Password डालें"
    >

    <button onclick="resetPassword()">
      नया Password सेट करें
    </button>

    <div id="message"></div>

  </div>

<script>

const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// Recovery link से session तैयार करें
async function prepareSession() {

  const hash = window.location.hash;

  if (!hash) {
    return;
  }

  const params = new URLSearchParams(
    hash.substring(1)
  );

  const accessToken = params.get("access_token");
  const refreshToken = params.get("refresh_token");

  if (accessToken && refreshToken) {

    const { error } =
      await supabaseClient.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

    if (error) {
      document.getElementById("message").innerText =
        "❌ Session नहीं बनी: " + error.message;
    }
  }
}


// Password बदलें
async function resetPassword() {

  const password =
    document.getElementById("newPassword").value.trim();

  const message =
    document.getElementById("message");

  if (!password) {
    message.innerText =
      "पहले नया Password डालें";
    return;
  }

  if (password.length < 6) {
    message.innerText =
      "Password कम से कम 6 अक्षर का होना चाहिए";
    return;
  }

  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });

  if (error) {

    message.innerText =
      "❌ Password update नहीं हुआ: " +
      error.message;

    return;
  }

  message.innerText =
    "✅ Password सफलतापूर्वक बदल गया!";

  setTimeout(() => {
    window.location.href = "index.html";
  }, 2000);
}


// Page खुलते ही recovery session तैयार करें
setTimeout(() => {
  prepareSession();
}, 1500);

</script>

</body>
</html>
