<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Sambandh360</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f1f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
    }

    h1 {
      color: #92256f;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: #92256f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔑 नया Password सेट करें</h1>

  <input
    type="password"
    id="newPassword"
    placeholder="नया Password डालें"
  >

  <button onclick="resetPassword()">
    नया Password सेट करें
  </button>

  <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function resetPassword() {

    const password =
      document.getElementById("newPassword").value.trim();

    const message =
      document.getElementById("message");

    if (!password) {
      message.innerText = "पहले नया Password डालें";
      return;
    }

    if (password.length < 6) {
      message.innerText =
        "Password कम से कम 6 अक्षर का होना चाहिए";
      return;
    }

    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if (error) {
      message.innerText =
        "❌ Password update नहीं हुआ: " + error.message;
      return;
    }

    message.innerText =
      "✅ Password सफलतापूर्वक बदल गया!";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 2000);
  }
</script>

</body>
</html>
