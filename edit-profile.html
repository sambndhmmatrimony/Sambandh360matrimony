<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile - Sambandh360</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f7f1f5;
  margin:0;
  padding:20px;
}

.container{
  max-width:600px;
  margin:20px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 20px #0002;
}

h1{
  text-align:center;
  color:#92256f;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

textarea{
  min-height:120px;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#92256f;
  color:white;
  font-size:18px;
}

button:disabled{
  opacity:.6;
}

#message{
  margin-top:15px;
  text-align:center;
  font-size:16px;
}

#preview{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  display:none;
  margin:15px auto;
}
</style>
</head>

<body>

<div class="container">

<div style="text-align:center;margin-bottom:20px;">
  <img src="logo.png" style="width:220px;max-width:100%;height:auto;">
</div>

<h2 style="text-align:center;">✏️ प्रोफाइल Edit करें</h2>

<label>पूरा नाम</label>
<input id="name" type="text">

<label>मोबाइल नंबर</label>
<input id="mobile" type="text">

<label>ईमेल</label>
<input id="email" type="email" readonly>

<label>Gender</label>
<select id="gender">
  <option value="">Select Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

<label>जन्म तारीख</label>
<input id="date_of_birth" type="date">

<label>उम्र</label>
<input id="age" type="number">

<label>वैवाहिक स्थिति</label>
<input id="marital_status" type="text">

<label>कद / Height</label>
<input id="height" type="text">

<label>वजन / Weight</label>
<input id="weight" type="text">

<label>रंग / Complexion</label>
<input id="complexion" type="text">

<label>धर्म</label>
<input id="religion" type="text">

<label>जाति</label>
<input id="caste" type="text">

<label>मातृभाषा</label>
<input id="mother_tongue" type="text">

<label>शहर</label>
<input id="city" type="text">

<label>राज्य</label>
<input id="state" type="text">

<label>शिक्षा</label>
<input id="education" type="text">

<label>शिक्षा का विवरण</label>
<input id="education_details" type="text">

<label>कॉलेज / यूनिवर्सिटी</label>
<input id="college" type="text">

<label>व्यवसाय</label>
<input id="occupation" type="text">

<label>कंपनी</label>
<input id="company" type="text">

<label>आमदनी</label>
<input id="income" type="text">

<label>पिता का नाम</label>
<input id="father_name" type="text">

<label>माता का नाम</label>
<input id="mother_name" type="text">

<label>भाई / बहन</label>
<input id="siblings" type="text">

<label>परिवार का प्रकार</label>
<input id="family_type" type="text">

<label>परिवार की स्थिति</label>
<input id="family_status" type="text">

<label>खान-पान</label>
<input id="food_habit" type="text">

<label>Smoking</label>
<input id="smoking" type="text">

<label>Drinking</label>
<input id="drinking" type="text">

<label>मेरे बारे में</label>
<textarea id="about"></textarea>

<label>परिचय / Bio</label>
<textarea id="bio"></textarea>

<h3>💍 जीवनसाथी की पसंद</h3>

<label>न्यूनतम उम्र</label>
<input id="partner_age_min" type="number">

<label>अधिकतम उम्र</label>
<input id="partner_age_max" type="number">

<label>कद / Height</label>
<input id="partner_height" type="text">

<label>शिक्षा</label>
<input id="partner_education" type="text">

<label>व्यवसाय</label>
<input id="partner_occupation" type="text">

<label>शहर</label>
<input id="partner_city" type="text">

<label>धर्म</label>
<input id="partner_religion" type="text">

<label>जाति</label>
<input id="partner_caste" type="text">

<label>Profile Photo बदलें</label>
<input id="photo" type="file" accept="image/*">

<img id="preview" style="max-width:200px;display:block;margin:10px auto;">

<button id="saveBtn" onclick="updateProfile()">
  💾 Update Profile
</button>

<div id="message"></div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://mrzhtybkorajumzunsbr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OpvjMBKiIqL-9tB-k5Xxhw_MkQhWBqz";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storageKey: "sambandh360-auth"
    }
  }
);

async function loadProfile() {

  const { data: userData, error: userError } =
    await supabase.auth.getUser();

  if (userError || !userData.user) {
    document.getElementById("message").innerText =
      "कृपया पहले Login करें।";
    return;
  }

  const user = userData.user;

  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (error) {
    document.getElementById("message").innerText =
      "Profile लोड नहीं हुई: " + error.message;
    return;
  }

  const fields = [
    "name",
    "mobile",
    "email",
    "gender",
    "date_of_birth",
    "age",
    "marital_status",
    "height",
    "weight",
    "complexion",
    "religion",
    "caste",
    "mother_tongue",
    "city",
    "state",
    "education",
    "education_details",
    "college",
    "occupation",
    "company",
    "income",
    "father_name",
    "mother_name",
    "siblings",
    "family_type",
    "family_status",
    "food_habit",
    "smoking",
    "drinking",
    "about",
    "bio",
    "partner_age_min",
    "partner_age_max",
    "partner_height",
    "partner_education",
    "partner_occupation",
    "partner_city",
    "partner_religion",
    "partner_caste"
  ];

  fields.forEach((field) => {

    const element = document.getElementById(field);

    if (!element) return;

    element.value = data[field] ?? "";

  });

  if (data.photo_url) {
    document.getElementById("preview").src = data.photo_url;
  }

}

async function updateProfile() {

  const { data: userData, error: userError } =
    await supabase.auth.getUser();

  if (userError || !userData.user) {
    document.getElementById("message").innerText =
      "कृपया पहले Login करें।";
    return;
  }

  const user = userData.user;

  const getValue = (id) => {
    const element = document.getElementById(id);
    return element ? element.value.trim() : "";
  };

  const name = getValue("name");

  if (!name) {
    document.getElementById("message").innerText =
      "नाम भरना जरूरी है।";
    return;
  }

  let photoUrl = null;

  const photoFile = document.getElementById("photo").files[0];

  if (photoFile) {

    const fileExt =
      photoFile.name.split(".").pop();

    const filePath =
      `${user.id}/${Date.now()}.${fileExt}`;

    const { error: uploadError } =
      await supabase.storage
        .from("profile-photos")
        .upload(filePath, photoFile, {
          upsert: true
        });

    if (uploadError) {
      document.getElementById("message").innerText =
        "Photo upload नहीं हुई: " +
        uploadError.message;
      return;
    }

    const { data: publicData } =
      supabase.storage
        .from("profile-photos")
        .getPublicUrl(filePath);

    photoUrl = publicData.publicUrl;
  }

  const updateData = {

    name: name,
    full_name: name,

    mobile: getValue("mobile"),
    gender: getValue("gender"),
    date_of_birth: getValue("date_of_birth") || null,
    age: Number(getValue("age")) || null,
    marital_status: getValue("marital_status"),
    height: getValue("height"),
    weight: getValue("weight"),
    complexion: getValue("complexion"),

    religion: getValue("religion"),
    caste: getValue("caste"),
    mother_tongue: getValue("mother_tongue"),

    city: getValue("city"),
    state: getValue("state"),

    education: getValue("education"),
    education_details: getValue("education_details"),
    college: getValue("college"),

    occupation: getValue("occupation"),
    company: getValue("company"),
    income: getValue("income"),

    father_name: getValue("father_name"),
    mother_name: getValue("mother_name"),
    siblings: getValue("siblings"),
    family_type: getValue("family_type"),
    family_status: getValue("family_status"),

    food_habit: getValue("food_habit"),
    smoking: getValue("smoking"),
    drinking: getValue("drinking"),

    about: getValue("about"),
    bio: getValue("bio"),

    partner_age_min:
      Number(getValue("partner_age_min")) || null,

    partner_age_max:
      Number(getValue("partner_age_max")) || null,

    partner_height: getValue("partner_height"),
    partner_education: getValue("partner_education"),
    partner_occupation: getValue("partner_occupation"),
    partner_city: getValue("partner_city"),
    partner_religion: getValue("partner_religion"),
    partner_caste: getValue("partner_caste")
  };

  if (photoUrl) {
    updateData.photo_url = photoUrl;
  }

  const { error } = await supabase
    .from("profiles")
    .update(updateData)
    .eq("id", user.id);

  if (error) {

    document.getElementById("message").innerText =
      "Update असफल: " + error.message;

    return;
  }

  document.getElementById("message").innerText =
    "Profile सफलतापूर्वक Update हो गई! ✅";

  setTimeout(() => {
    window.location.href = "profile.html";
  }, 1500);
}

window.updateProfile = updateProfile;

loadProfile();

</script>
